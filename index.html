<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caccia al Tesoro AR - Marker</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: transparent !important; font-family: sans-serif; }
        video { position: fixed !important; top: 0 !important; left: 0 !important; z-index: -1 !important; }
        
        /* UI del Quiz */
        #quiz-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #2c3e50; color: white; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 2000; text-align: center; padding: 20px;
        }

        /* UI in AR */
        #ar-ui {
            position: fixed; top: 10px; width: 100%; z-index: 1000; display: none; 
            justify-content: space-around; pointer-events: none;
        }
        .stat { background: rgba(0,0,0,0.8); color: #f1c40f; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; }
        
        input { padding: 10px; font-size: 16px; margin: 10px 0; width: 80%; max-width: 300px; border-radius: 5px; border: none; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>

    <script>
        // COMPONENTE: Gestisce il tocco sull'oggetto
        AFRAME.registerComponent('premio-cliccabile', {
            init: function () {
                this.el.addEventListener('click', () => {
                    alert('🎉 OGGETTO TROVATO! +100 PUNTI!');
                    
                    // Aggiorna punteggio
                    let scoreSpan = document.getElementById('score');
                    scoreSpan.innerText = parseInt(scoreSpan.innerText) + 100;
                    
                    // Fa sparire l'oggetto dopo averlo toccato
                    this.el.setAttribute('visible', 'false');

                    // Opzionale: Torna al quiz dopo 2 secondi per la prossima domanda
                    setTimeout(() => {
                        alert("Preparati per il prossimo indizio!");
                        // Qui potresti ricaricare l'interfaccia del quiz per la domanda 2
                    }, 2000);
                });
            }
        });
    </script>
</head>

<body>

    <div id="quiz-screen">
        <h2>Domanda 1</h2>
        <p>Qual è la molecola dell'acqua?</p>
        <input type="text" id="risposta" placeholder="Es: CO2">
        <button onclick="controllaRisposta()">CONFERMA</button>
        
        <div id="indizio" style="display: none; margin-top: 20px; color: #f1c40f;">
            <p><strong>Corretto!</strong></p>
            <p>Indizio: Vai in cucina e inquadra il simbolo magico (Hiro) sul tavolo.</p>
            <button onclick="avviaAR()" style="background: #e67e22;">ATTIVA SCANNER AR</button>
        </div>
    </div>

    <div id="ar-ui">
        <div class="stat">PUNTI: <span id="score">0</span></div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" 
             renderer="alpha: true; antialias: true;"
             vr-mode-ui="enabled: false"
             cursor="rayOrigin: mouse" 
             raycaster="objects: .interattivo">
        
        <a-marker type="pattern" url="pattern-1.patt">
            
            <a-box class="interattivo" premio-cliccabile
                   position="0 0.5 0" 
                   material="color: gold; opacity: 0.9;" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
            </a-box>
            
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        function controllaRisposta() {
            let risposta = document.getElementById('risposta').value.toLowerCase().trim();
            if (risposta === 'h2o') {
                document.getElementById('indizio').style.display = 'block';
            } else {
                alert('Risposta errata, scienziato! Riprova.');
            }
        }

        function avviaAR() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('ar-ui').style.display = 'flex';
            document.body.style.backgroundColor = "transparent";

            // Forza l'avvio della camera e risolve i problemi grafici
            const video = document.querySelector('video');
            if (video) { 
                video.play(); 
                video.style.zIndex = "-1"; 
            }
            window.dispatchEvent(new Event('resize'));
        }
    </script>
</body>
</html>
