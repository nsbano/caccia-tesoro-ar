<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scienza AR - Missione</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        :root {
            --primary: #00d2ff;
            --dark: #1a1a2e;
            --accent: #f1c40f;
        }

        /* Reset fondamentale per AR.js */
    body {
        background-color: transparent !important;
    }

    /* La scena AR deve essere visibile */
    a-scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1; /* Sotto la UI */
    }

        /* Layer UI: Fisso e sempre sopra */
        #ui-master {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 999;
            pointer-events: none; /* Cruciale: permette al tocco di passare sotto se non c'è un menu */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Schermate a pieno schermo (Login e Quiz) */
        .full-screen-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto; /* Riattiva i click per i pulsanti */
        }

        /* Box centrali migliorati per mobile */
        .glass-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 85%;
            max-width: 320px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
            color: white;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.9);
            font-size: 16px; /* Impedisce lo zoom su iOS */
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Elementi sopra la camera (HUD) */
        #game-stats {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            width: 90%;
            display: none;
            justify-content: space-between;
            pointer-events: none;
        }

        .stat-badge {
            background: rgba(0,0,0,0.7);
            color: var(--accent);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid var(--accent);
        }

        #instruction-bar {
            position: absolute;
            bottom: max(40px, env(safe-area-inset-bottom));
            width: 80%;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            display: none;
            font-size: 14px;
            border: 1px solid var(--primary);
        }

        /* Fix per il video di A-Frame */
        .a-canvas { z-index: 1; }
    </style>
</head>
<body>

    <div id="ui-master">
        
        <div id="screen-login" class="full-screen-overlay">
            <div class="glass-box">
                <h1 style="color:var(--primary); margin-bottom:5px;">SCIENZA AR</h1>
                <p style="opacity:0.7; margin-bottom:20px;">Inserisci le tue credenziali</p>
                <input type="text" id="nome" placeholder="Nome" autocomplete="off">
                <input type="text" id="cognome" placeholder="Cognome" autocomplete="off">
                <button onclick="startGame()">INIZIA LA MISSIONE</button>
            </div>
        </div>

        <div id="screen-quiz" class="full-screen-overlay" style="display: none;">
            <div class="glass-box">
                <h2 id="level-label" style="color:var(--primary); margin:0;">Livello 1</h2>
                <p id="question-txt" style="margin: 20px 0; min-height: 50px;">...</p>
                <input type="text" id="answer-in" placeholder="Scrivi qui..." autocomplete="off">
                <button onclick="checkAnswer()">VERIFICA</button>
                <div id="hint-txt" style="display:none; color:var(--accent); margin-top:15px; font-size:14px; font-style:italic;"></div>
                <button id="btn-scan" onclick="goAR()" style="display:none; background:#27ae60;">APRI SCANNER AR</button>
            </div>
        </div>

        <div id="game-stats">
            <div class="stat-badge">👤 <span id="user-display">---</span></div>
            <div class="stat-badge">🏆 PUNTI: <span id="score-display">0</span></div>
        </div>

        <div id="instruction-bar">Inquadra l'oggetto per completare il livello!</div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; videoSettings: {facingMode: 'environment'};"
             vr-mode-ui="enabled: false">
        
        <a-marker type="pattern" url="marker2.patt" id="marker-0">
            <a-sphere position="0 0.5 0" radius="0.5" color="#00d2ff" animation="property: position; to: 0 0.7 0; dir: alternate; dur: 1000; loop: true"></a-sphere>
        </a-marker>

        <a-marker type="pattern" url="marker3.patt" id="marker-1">
            <a-box position="0 0.5 0" material="color: #ff4757" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let currentLevel = 0;
        let currentSub = 0;
        let score = 0;

        const data = [
            { 
                questions: [
                    { q: "Qual è la formula chimica dell'acqua?", a: "h2o" },
                    { q: "A quanti gradi bolle l'acqua?", a: "100" }
                ],
                hint: "Cerca vicino a un lavandino o una bottiglia!"
            },
            { 
                questions: [
                    { q: "Quante eliche ha il DNA?", a: "2" }
                ],
                hint: "Cerca tra i libri di scienze!"
            }
        ];

        function startGame() {
            const n = document.getElementById('nome').value.trim();
            const c = document.getElementById('cognome').value.trim();
            if(!n || !c) return alert("Inserisci i dati!");
            
            document.getElementById('user-display').innerText = n;
            document.getElementById('screen-login').style.display = 'none';
            showQuiz();
        }

        function showQuiz() {
            if(currentLevel >= data.length) {
                alert("MISSIONE COMPLETATA!");
                location.reload();
                return;
            }

            document.getElementById('screen-quiz').style.display = 'flex';
            document.getElementById('game-stats').style.display = 'none';
            document.getElementById('instruction-bar').style.display = 'none';
            document.getElementById('btn-scan').style.display = 'none';
            document.getElementById('hint-txt').style.display = 'none';

            const levelData = data[currentLevel];
            document.getElementById('level-label').innerText = "Oggetto " + (currentLevel + 1);
            document.getElementById('question-txt').innerText = levelData.questions[currentSub].q;
            document.getElementById('answer-in').value = "";
        }

        function checkAnswer() {
            const ans = document.getElementById('answer-in').value.toLowerCase().trim();
            const levelData = data[currentLevel];

            if(ans === levelData.questions[currentSub].a) {
                if(currentSub < levelData.questions.length - 1) {
                    currentSub++;
                    showQuiz();
                } else {
                    document.getElementById('hint-txt').innerText = "Indizio: " + levelData.hint;
                    document.getElementById('hint-txt').style.display = 'block';
                    document.getElementById('btn-scan').style.display = 'block';
                }
            } else {
                alert("Risposta errata, riprova!");
            }
        }

        function goAR() {
            document.getElementById('screen-quiz').style.display = 'none';
            document.getElementById('game-stats').style.display = 'flex';
            document.getElementById('instruction-bar').style.display = 'block';
        }

        // Logica di rilevamento marker
        window.onload = () => {
            const markers = document.querySelectorAll('a-marker');
            markers.forEach(m => {
                m.addEventListener('markerFound', () => {
                    const isScanning = document.getElementById('instruction-bar').style.display === 'block';
                    if(isScanning && m.id === "marker-" + currentLevel) {
                        score += 100;
                        document.getElementById('score-display').innerText = score;
                        alert("OGGETTO TROVATO! +100 PUNTI");
                        currentLevel++;
                        currentSub = 0;
                        showQuiz();
                    }
                });
            });
        }
    </script>
</body>
</html>
