<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caccia al Tesoro AR - Chrome Fix</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        /* RESET AGGRESSIVO PER CHROME */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; /* Fondo nero di sicurezza */
            font-family: sans-serif;
            overflow: hidden;
        }

        /* IL TRUCCO PER CHROME: Un contenitore UI che non blocca la camera */
        #master-ui {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10; /* Sopra la camera */
            display: flex;
            flex-direction: column;
            pointer-events: none; /* Lascia passare i click alla camera se serve */
        }

        .screen {
            background: rgba(15, 15, 25, 0.95);
            padding: 30px; border-radius: 20px;
            border: 2px solid #00d2ff;
            width: 85%; max-width: 320px;
            text-align: center; color: white;
            pointer-events: auto; /* Riattiva i click per i bottoni */
            margin: auto; /* Centra perfettamente */
            display: none;
        }

        .screen.active { display: block; }

        /* HUD - Sempre visibile in alto */
        #hud {
            width: 100%;
            padding: 15px;
            display: none;
            justify-content: space-between;
            pointer-events: none;
            position: absolute; top: 0;
        }

        .badge {
            background: rgba(0,0,0,0.8); color: white;
            padding: 8px 12px; border: 1px solid #00d2ff;
            border-radius: 10px; font-weight: bold; pointer-events: auto;
        }

        /* BOTTONE CONTINUA - In basso */
        #footer-action {
            position: absolute; bottom: 40px; width: 100%;
            display: none; justify-content: center;
            pointer-events: none;
        }

        .btn-success {
            background: #2ecc71; color: white; border: none;
            padding: 15px 30px; border-radius: 50px;
            font-weight: bold; font-size: 18px;
            pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: none; font-size: 16px; }
        button.primary { width: 100%; padding: 15px; background: #00d2ff; border: none; font-weight: bold; border-radius: 8px; }

        /* FIX CAMERA: Forza il video a stare sotto tutto */
        video { position: fixed !important; top: 0 !important; left: 0 !important; z-index: -1 !important; }
        .a-canvas { z-index: 0 !important; }
    </style>
</head>
<body>

    <div id="master-ui">
        
        <div id="hud">
            <div class="badge">⏳ <span id="timer-val">60:00</span></div>
            <div class="badge">⭐ <span id="score-val">0</span></div>
        </div>

        <div id="scr-login" class="screen active">
            <h2>SCIENZA AR</h2>
            <p>Inserisci l'email per iniziare</p>
            <input type="email" id="email" placeholder="nico@gmail.com" value="nico@gmail.com">
            <button class="primary" onclick="startApp()">ACCEDI</button>
        </div>

        <div id="scr-quiz" class="screen">
            <h3 id="q-title" style="color:#00d2ff; margin:0;">FASE 1</h3>
            <p id="q-text" style="margin:20px 0;">Caricamento...</p>
            <input type="text" id="ans" placeholder="Risposta...">
            <button class="primary" onclick="checkAnswer()">INVIA</button>
        </div>

        <div id="footer-action">
            <button class="btn-success" onclick="nextStage()">TROVATO! CONTINUA ➔</button>
        </div>

    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" vr-mode-ui="enabled: false">
        <a-marker type="barcode" value="1" id="mark-0">
            <a-image src="marker2.jpeg" rotation="-90 0 0" width="2" height="2"></a-image>
        </a-marker>
        <a-marker type="barcode" value="2" id="mark-1">
            <a-image src="marker3.jpeg" rotation="-90 0 0" width="2" height="2"></a-image>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const database = {
            "nico@gmail.com": [
                {
                    questions: [{q:"Formula acqua?", a:"h2o"}, {q:"Pianeti?", a:"8"}, {q:"Gas vita?", a:"ossigeno"}],
                    hint: "Cerca il Barcode 1 sulla cattedra!"
                },
                {
                    questions: [{q:"Eliche DNA?", a:"2"}, {q:"Città eterna?", a:"roma"}, {q:"7 + 3?", a:"10"}],
                    hint: "Cerca il Barcode 2 sulla porta!"
                }
            ]
        };

        let mission = [];
        let stageIdx = 0;
        let questIdx = 0;
        let points = 0;
        let timer = 3600;
        let scanningMode = false;

        function startApp() {
            const email = document.getElementById('email').value.toLowerCase().trim();
            if(database[email]) {
                mission = database[email];
                document.getElementById('scr-login').classList.remove('active');
                document.getElementById('hud').style.display = 'flex';
                document.body.style.backgroundColor = 'transparent';
                startTimer();
                updateQuiz();
            } else { alert("Email non valida!"); }
        }

        function updateQuiz() {
            if(stageIdx >= mission.length) {
                showFinal();
                return;
            }

            const data = mission[stageIdx];
            if(questIdx < 3) {
                document.getElementById('q-title').innerText = `FASE ${stageIdx+1} - DOMANDA ${questIdx+1}/3`;
                document.getElementById('q-text').innerText = data.questions[questIdx].q;
                document.getElementById('ans').value = "";
                document.getElementById('scr-quiz').classList.add('active');
            } else {
                // Tutte le 3 domande fatte
                document.getElementById('q-title').innerText = "DOMANDE COMPLETATE!";
                document.getElementById('q-text').innerText = data.hint;
                document.getElementById('ans').style.display = 'none';
                document.getElementById('scr-quiz').querySelector('button').innerText = "ATTIVA SCANNER";
                document.getElementById('scr-quiz').querySelector('button').setAttribute("onclick", "enableScanner()");
            }
        }

        function checkAnswer() {
            const val = document.getElementById('ans').value.toLowerCase().trim();
            const correct = mission[stageIdx].questions[questIdx].a;
            if(val === correct) {
                questIdx++;
                updateQuiz();
            } else { alert("Sbagliato!"); }
        }

        function enableScanner() {
            document.getElementById('scr-quiz').classList.remove('active');
            scanningMode = true;
            // Qui Chrome vedrà la camera perché il quiz scompare
        }

        function nextStage() {
            points += 50;
            document.getElementById('score-val').innerText = points;
            document.getElementById('footer-action').style.display = 'none';
            stageIdx++;
            questIdx = 0;
            scanningMode = false;
            
            // Ripristina il box quiz
            document.getElementById('ans').style.display = 'block';
            document.getElementById('scr-quiz').querySelector('button').innerText = "INVIA";
            document.getElementById('scr-quiz').querySelector('button').setAttribute("onclick", "checkAnswer()");
            updateQuiz();
        }

        function startTimer() {
            setInterval(() => {
                if(timer <= 0) return;
                timer--;
                let m = Math.floor(timer/60);
                let s = timer%60;
                document.getElementById('timer-val').innerText = `${m}:${s<10?'0':''}${s}`;
            }, 1000);
        }

        function showFinal() {
            const bonus = Math.floor(timer/60);
            document.getElementById('scr-quiz').innerHTML = `<h2>FINE!</h2><p>Punti: ${points}<br>Bonus Tempo: ${bonus}</p><h1>TOTALE: ${points+bonus}</h1>`;
            document.getElementById('scr-quiz').classList.add('active');
            document.getElementById('hud').style.display = 'none';
        }

        // LOGICA MARKER
        window.onload = () => {
            const markers = document.querySelectorAll('a-marker');
            markers.forEach((m, i) => {
                m.addEventListener('markerFound', () => {
                    if(scanningMode && i === stageIdx) {
                        document.getElementById('footer-action').style.display = 'flex';
                    }
                });
            });
        }
    </script>
</body>
</html>
