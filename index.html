<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scienza AR - Fix Totale</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; }
        
        /* Forza il video a stare sotto tutto */
        video {
            position: fixed !important;
            top: 0; left: 0;
            width: 100% !important; height: 100% !important;
            object-fit: cover !important;
            z-index: -1 !important;
        }

        #ui-layer {
            position: fixed; top: 10px; width: 100%; display: none;
            justify-content: space-around; z-index: 1000;
        }
        .stat { background: rgba(0,0,0,0.8); color: cyan; padding: 10px; border-radius: 5px; font-family: sans-serif; }
        
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: white; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; z-index: 2000;
        }
        button { padding: 20px 40px; font-size: 1.2rem; background: cyan; border: none; cursor: pointer; color: black; font-weight: bold; }
    </style>
</head>

<body>

    <div id="overlay">
        <h1>REALTÀ AUMENTATA</h1>
        <button onclick="init()">AVVIA ESPERIENZA</button>
    </div>

    <div id="ui-layer">
        <div class="stat">PUNTI: <span id="punti">0</span></div>
        <div class="stat">TEMPO: <span id="tempo">60:00</span></div>
    </div>

    <a-scene embedded 
             arjs='sourceType: webcam; debugUIEnabled: false; trackingMethod: best;' 
             renderer="alpha: true; antialias: true; logarithmicDepthBuffer: true;">
        
        <a-box position="0 0.5 -3" material="color: red; opacity: 0.8;" 
               animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-box>

        <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
        function init() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            
            // Forza il background trasparente
            document.body.style.backgroundColor = "transparent";

            // Trova il video e forzalo a riprodursi
            const video = document.querySelector('video');
            if (video) {
                video.style.zIndex = "-1";
                video.play();
            }

            // Avvia timer
            let t = 3600;
            setInterval(() => {
                t--;
                let m = Math.floor(t/60), s = t%60;
                document.getElementById('tempo').innerText = `${m}:${s<10?'0':''}${s}`;
            }, 1000);

            // Scuote la scena per forzare il rendering
            window.dispatchEvent(new Event('resize'));
        }
    </script>
</body>
</html>
