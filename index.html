<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Scienza - Fix Trasparenza</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        /* Forza tutto a essere trasparente */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
        
        #ui { position: fixed; top: 10px; width: 100%; z-index: 1000; display: none; justify-content: space-around; pointer-events: none; }
        .stat { background: rgba(0,0,0,0.8); color: cyan; padding: 10px; border-radius: 8px; font-family: monospace; border: 1px solid cyan; }
        
        #start-btn { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 20px; z-index: 2000; background: cyan; border: none; font-weight: bold; border-radius: 10px; }

        /* Assicura che il video creato da AR.js non sia nascosto */
        video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            z-index: -1 !important;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden; background-color: transparent;">

    <button id="start-btn" onclick="start()">AVVIA CAMERA</button>

    <div id="ui">
        <div class="stat">PUNTI: <span id="s">0</span></div>
        <div class="stat">TEMPO: <span id="t">60:00</span></div>
    </div>

    <a-scene embedded 
             arjs='sourceType: webcam; debugUIEnabled: false;' 
             renderer="alpha: true; antialias: true;"
             style="background: transparent !important;">
        
        <a-entity position="0 0 -3">
            <a-box material="color: red; opacity: 0.9;" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
            </a-box>
        </a-entity>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        function start() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('ui').style.display = 'flex';
            
            // Forza la trasparenza del background del browser
            document.body.style.backgroundColor = "transparent";

            // Forza il video a riprodursi e stare dietro
            const video = document.querySelector('video');
            if (video) {
                video.play();
                video.style.zIndex = "-1";
            }

            // Timer
            let sec = 3600;
            setInterval(() => {
                sec--;
                let m = Math.floor(sec/60), s = sec%60;
                document.getElementById('t').innerText = `${m}:${s<10?'0':''}${s}`;
            }, 1000);

            // Importante: aggiorna le dimensioni per allineare tutto
            window.dispatchEvent(new Event('resize'));
        }
    </script>
</body>
</html>
