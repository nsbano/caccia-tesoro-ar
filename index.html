<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Debug AR Scienza</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-look-around.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #debug-console {
            position: fixed; top: 10px; left: 10px; z-index: 10000;
            color: lime; font-family: monospace; font-size: 10px;
            pointer-events: none; background: rgba(0,0,0,0.5);
        }
        #start-button {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 20px; z-index: 10001;
            background: #64ffda; border: none; border-radius: 10px; cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="debug-console">Inizializzazione...</div>
    <button id="start-button" onclick="startExperience()">CLICCA PER ATTIVARE CAMERA</button>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;" 
        vr-mode-ui="enabled: false">
        
        <a-box position="0 0.5 -5" material="color: red;" look-at="[gps-camera]"
               gps-entity-place="latitude: 45.4641; longitude: 9.1901;">
        </a-box>

        <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
        const log = (msg) => {
            document.getElementById('debug-console').innerHTML += `<br>> ${msg}`;
            console.log(msg);
        };

        window.onerror = (msg, url, line) => {
            log(`ERRORE: ${msg} (linea ${line})`);
        };

        function startExperience() {
            log("Pulsante cliccato");
            document.getElementById('start-button').style.display = 'none';
            log("Tentativo avvio camera...");
            
            // Forza il browser a svegliarsi
            const scene = document.querySelector('a-scene');
            if (scene) {
                log("Scena trovata");
                // Questo comando forza AR.js a inizializzare la camera
                scene.addEventListener('loaded', () => log("A-Frame Caricato!"));
            } else {
                log("ERRORE: Scena non trovata!");
            }
        }

        window.onload = () => log("Pagina caricata. Pronto.");
    </script>
</body>
</html>
