<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scienza AR - Fix Mobile</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        /* FORZATURA TRASPARENZA TOTALE */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background-color: transparent !important; /* MAI NERO */
            overflow: hidden !important;
        }

        /* IL VIDEO DELLA CAMERA */
        video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            z-index: -1 !important; /* Dietro a tutto */
        }

        /* LAYER UI - IL PIÙ ALTO POSSIBILE */
        #master-ui {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2147483647 !important; /* Massimo valore possibile */
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        /* SCHERMATE (LOGIN E QUIZ) */
        .full-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a2e; /* Blu scuro solido per i menu */
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto;
        }

        .box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 25px; border-radius: 20px;
            border: 2px solid #00d2ff;
            width: 80%; max-width: 300px;
            text-align: center; color: white;
            font-family: sans-serif;
        }

        /* HUD - I CONTATORI CHE NON VEDI */
        #hud-ar {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            padding: 40px 20px; /* Spazio per la notch */
            display: none; /* Appare solo in AR */
            justify-content: space-between;
            box-sizing: border-box;
            pointer-events: none;
        }

        .badge {
            background: rgba(0, 0, 0, 0.8) !important;
            color: #f1c40f !important;
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #f1c40f;
            font-size: 18px;
            font-weight: bold;
            pointer-events: auto;
        }

        #bottom-bar {
            position: absolute;
            bottom: 50px; left: 5%;
            width: 90%;
            background: rgba(0, 0, 0, 0.8) !important;
            color: white !important;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            display: none;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #00d2ff;
        }

        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #00d2ff; border: none; color: white; font-weight: bold; border-radius: 8px; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="master-ui">
        <div id="screen-login" class="full-overlay">
            <div class="box">
                <h2 style="color:#00d2ff; margin-top:0;">MISSIONE AR</h2>
                <input type="text" id="n" placeholder="Nome">
                <input type="text" id="c" placeholder="Cognome">
                <button onclick="avvia()">INIZIA</button>
            </div>
        </div>

        <div id="screen-quiz" class="full-overlay" style="display:none;">
            <div class="box">
                <h3 id="lvl-txt" style="color:#00d2ff;">OGGETTO 1</h3>
                <p id="domanda">...</p>
                <input type="text" id="risposta" placeholder="Scrivi qui...">
                <button onclick="controlla()">VERIFICA</button>
                <div id="indizio" style="display:none; color:#f1c40f; margin-top:10px; font-weight:bold;"></div>
                <button id="btn-camera" onclick="apriCamera()" style="display:none; background:#27ae60;">VAI ALLA CAMERA</button>
            </div>
        </div>

        <div id="hud-ar">
            <div class="badge" id="display-nome">---</div>
            <div class="badge">PT: <span id="display-punti">0</span></div>
        </div>
        <div id="bottom-bar">Inquadra l'oggetto!</div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; facingMode: environment;" vr-mode-ui="enabled: false">
        <a-marker type="pattern" url="marker2.patt" id="marker-0">
            <a-sphere position="0 0.5 0" radius="0.5" color="#00d2ff"></a-sphere>
        </a-marker>
        <a-marker type="pattern" url="marker3.patt" id="marker-1">
            <a-box position="0 0.5 0" color="#ff4757"></a-box>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let lvl = 0; let sub = 0; let pt = 0;
        const dati = [
            { q: [{d:"Formula acqua?", r:"h2o"}, {d:"Gradi bolle?", r:"100"}], h:"Cerca al lavandino" },
            { q: [{d:"Eliche DNA?", r:"2"}], h:"Cerca tra i libri" }
        ];

        // KILLER DEL NERO: Forza la trasparenza ogni 500ms
        setInterval(() => {
            document.documentElement.style.backgroundColor = "transparent";
            document.body.style.backgroundColor = "transparent";
        }, 500);

        function avvia() {
            const nome = document.getElementById('n').value;
            if(!nome) return alert("Manca il nome!");
            document.getElementById('display-nome').innerText = nome.toUpperCase();
            document.getElementById('screen-login').style.display = 'none';
            mostraQuiz();
        }

        function mostraQuiz() {
            if(lvl >= dati.length) return alert("FINE!");
            document.getElementById('screen-quiz').style.display = 'flex';
            document.getElementById('hud-ar').style.display = 'none';
            document.getElementById('bottom-bar').style.display = 'none';
            document.getElementById('indizio').style.display = 'none';
            document.getElementById('btn-camera').style.display = 'none';
            
            document.getElementById('lvl-txt').innerText = "OGGETTO " + (lvl+1);
            document.getElementById('domanda').innerText = dati[lvl].q[sub].d;
            document.getElementById('risposta').value = "";
        }

        function controlla() {
            const ris = document.getElementById('risposta').value.toLowerCase().trim();
            if(ris === dati[lvl].q[sub].r) {
                if(sub < dati[lvl].q[sub].length - 1) { sub++; mostraQuiz(); }
                else {
                    document.getElementById('indizio').innerText = "Indizio: " + dati[lvl].h;
                    document.getElementById('indizio').style.display = 'block';
                    document.getElementById('btn-camera').style.display = 'block';
                }
            } else { alert("Sbagliato!"); }
        }

        function apriCamera() {
            document.getElementById('screen-quiz').style.display = 'none';
            document.getElementById('hud-ar').style.display = 'flex';
            document.getElementById('bottom-bar').style.display = 'block';
        }

        window.onload = () => {
            document.querySelectorAll('a-marker').forEach(m => {
                m.addEventListener('markerFound', () => {
                    if(document.getElementById('screen-quiz').style.display === 'none' && m.id === "marker-"+lvl) {
                        pt += 100;
                        document.getElementById('display-punti').innerText = pt;
                        alert("TROVATO!");
                        lvl++; sub = 0; mostraQuiz();
                    }
                });
            });
        }
    </script>
</body>
</html>
