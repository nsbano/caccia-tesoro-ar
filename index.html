<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scienza AR - Android Fix</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-look-around.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: none !important; }
        
        /* Forza il video a stare sotto */
        video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            z-index: -1 !important; /* Dietro tutto */
        }

        /* Forza il Canvas 3D a stare SOPRA il video */
        canvas.a-canvas {
            z-index: 5 !important;
            position: relative;
        }

        #ui {
            position: fixed; top: 10px; width: 100%; z-index: 100;
            display: none; justify-content: space-around; pointer-events: none;
        }
        .stat { background: rgba(0,0,0,0.8); color: #00ff00; padding: 10px; border-radius: 8px; font-family: monospace; }
        
        #btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 20px; z-index: 10000;
            background: #00ff00; color: black; border: none; font-weight: bold; border-radius: 10px;
        }
    </style>
</head>

<body>

    <button id="btn" onclick="startExperience()">AVVIA MISSIONE</button>

    <div id="ui">
        <div class="stat">PUNTI: <span id="s">0</span></div>
        <div class="stat">TEMPO: <span id="t">60:00</span></div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false;" 
             renderer="alpha: true; antialias: true; preserveDrawingBuffer: true;"
             vr-mode-ui="enabled: false">
        
        <a-box position="0 1.5 -3" material="color: red; opacity: 0.9;" 
               animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-box>

        <a-camera rotation-reader></a-camera>
    </a-scene>

    <script>
        function startExperience() {
            document.getElementById('btn').style.display = 'none';
            document.getElementById('ui').style.display = 'flex';
            document.body.style.backgroundColor = "transparent";

            // Cerchiamo il video che AR.js ha creato automaticamente
            const checkVideo = setInterval(() => {
                const video = document.querySelector('video');
                if (video) {
                    video.style.zIndex = "-1"; // Lo mettiamo sotto
                    video.play();
                    clearInterval(checkVideo);
                }
            }, 100);

            // Timer
            let sec = 3600;
            setInterval(() => {
                sec--;
                let m = Math.floor(sec/60), s = sec%60;
                document.getElementById('t').innerText = `${m}:${s<10?'0':''}${s}`;
            }, 1000);

            // Forza il refresh
            window.dispatchEvent(new Event('resize'));
        }
    </script>
</body>
</html>
