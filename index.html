<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scienza AR - Missione</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        :root {
            --primary: #00d2ff;
            --dark: #1a1a2e;
            --accent: #f1c40f;
        }

        /* 1. TRASPARENZA TOTALE - Fondamentale per vedere la camera */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: sans-serif;
            background: none !important; /* Rimuove il nero */
        }

        /* 2. HUD FISSO - Sempre in cima, indipendentemente dai menu */
        #hud-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 99999;
            pointer-events: none; /* Cruciale: i click passano attraverso */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-top-bar {
            display: none; /* Appare solo in AR */
            justify-content: space-between;
            padding: 40px 20px; /* Spazio per la notch */
        }

        .stat-badge {
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            padding: 12px 20px;
            border-radius: 12px;
            border: 2px solid var(--accent);
            font-size: 20px;
            font-weight: bold;
            pointer-events: auto;
        }

        #instruction-text {
            display: none; /* Appare solo in AR */
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 20px;
            margin: 0 20px 40px 20px;
            border-radius: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid var(--primary);
        }

        /* 3. SCHERMATE DI GIOCO (LOGIN E QUIZ) */
        .overlay-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--dark); /* Qui il colore serve per coprire la camera all'inizio */
            z-index: 100000;
            display: flex; align-items: center; justify-content: center;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px; border-radius: 25px;
            border: 2px solid var(--primary);
            width: 85%; max-width: 320px;
            text-align: center; color: white;
        }

        input {
            width: 100%; padding: 15px; margin: 15px 0;
            border-radius: 12px; border: none; font-size: 18px;
            box-sizing: border-box;
        }

        button {
            width: 100%; padding: 18px;
            background: var(--primary); color: white;
            border: none; border-radius: 12px;
            font-weight: bold; font-size: 18px;
            cursor: pointer;
        }

        /* FIX PER IL VIDEO */
        .a-canvas { z-index: 0; }
        video { z-index: -1 !important; position: fixed !important; top:0; left:0; }
    </style>
</head>
<body>

    <div id="hud-container">
        <div id="hud-visuals" class="hud-top-bar">
            <div class="stat-badge" id="name-tag">---</div>
            <div class="stat-badge">PT: <span id="points-tag">0</span></div>
        </div>
        <div id="instruction-text">Punta la fotocamera verso l'oggetto!</div>
    </div>

    <div id="screen-login" class="overlay-screen">
        <div class="glass-box">
            <h1 style="color:var(--primary); margin:0 0 10px 0;">SCIENZA AR</h1>
            <p>Inserisci i tuoi dati</p>
            <input type="text" id="user-n" placeholder="Nome">
            <input type="text" id="user-c" placeholder="Cognome">
            <button onclick="doStart()">ACCEDI</button>
        </div>
    </div>

    <div id="screen-quiz" class="overlay-screen" style="display: none;">
        <div class="glass-box">
            <h2 id="lvl-label" style="color:var(--primary)">LIVELLO 1</h2>
            <p id="q-text" style="font-size: 18px; margin: 20px 0;">...</p>
            <input type="text" id="ans-input" placeholder="Risposta...">
            <button onclick="doCheck()">VERIFICA</button>
            <p id="h-text" style="display:none; color:var(--accent); font-weight:bold; margin-top:15px;"></p>
            <button id="btn-open-ar" onclick="doOpenAR()" style="display:none; background:#2ecc71; margin-top:10px;">VAI ALLA CAMERA</button>
        </div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; facingMode: environment;"
             vr-mode-ui="enabled: false">
        
        <a-marker type="pattern" url="marker2.patt" id="marker-0">
            <a-sphere position="0 0.5 0" radius="0.5" color="#00d2ff"></a-sphere>
        </a-marker>

        <a-marker type="pattern" url="marker3.patt" id="marker-1">
            <a-box position="0 0.5 0" color="#ff4757"></a-box>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let currentLvl = 0;
        let currentSub = 0;
        let score = 0;

        const game = [
            { 
                qs: [{q: "Formula dell'acqua?", a: "h2o"}, {q: "Temperatura ebollizione?", a: "100"}],
                hint: "Indizio: Cerca vicino al lavandino!"
            },
            { 
                qs: [{q: "Quante eliche ha il DNA?", a: "2"}],
                hint: "Indizio: Cerca tra i libri!"
            }
        ];

        function doStart() {
            const n = document.getElementById('user-n').value;
            const c = document.getElementById('user-c').value;
            if(!n || !c) return alert("Mancano i dati!");
            
            document.getElementById('name-tag').innerText = n.toUpperCase();
            document.getElementById('screen-login').style.display = 'none';
            loadStep();
        }

        function loadStep() {
            if(currentLvl >= game.length) {
                alert("MISSIONE FINITA!");
                location.reload();
                return;
            }
            // Mostra lo schermo del quiz (che copre la camera)
            document.getElementById('screen-quiz').style.display = 'flex';
            
            // Nascondi HUD AR
            document.getElementById('hud-visuals').style.display = 'none';
            document.getElementById('instruction-text').style.display = 'none';
            
            document.getElementById('btn-open-ar').style.display = 'none';
            document.getElementById('h-text').style.display = 'none';

            const data = game[currentLvl];
            document.getElementById('lvl-label').innerText = "OGGETTO #" + (currentLvl + 1);
            document.getElementById('q-text').innerText = data.qs[currentSub].q;
            document.getElementById('ans-input').value = "";
        }

        function doCheck() {
            const r = document.getElementById('ans-input').value.toLowerCase().trim();
            const data = game[currentLvl];

            if(r === data.qs[currentSub].a) {
                if(currentSub < data.qs.length - 1) {
                    currentSub++;
                    loadStep();
                } else {
                    document.getElementById('h-text').innerText = data.hint;
                    document.getElementById('h-text').style.display = 'block';
                    document.getElementById('btn-open-ar').style.display = 'block';
                }
            } else {
                alert("Sbagliato, riprova!");
            }
        }

        function doOpenAR() {
            // Nasconde il quiz, lasciando vedere la camera sotto
            document.getElementById('screen-quiz').style.display = 'none';
            
            // Mostra i contatori sopra il video
            document.getElementById('hud-visuals').style.display = 'flex';
            document.getElementById('instruction-text').style.display = 'block';
        }

        // Gestione Marker
        window.addEventListener('load', () => {
            const markers = document.querySelectorAll('a-marker');
            markers.forEach(m => {
                m.addEventListener('markerFound', () => {
                    // Controlla se siamo in modalità camera
                    const isAR = document.getElementById('screen-quiz').style.display === 'none';
                    if(isAR && m.id === "marker-" + currentLvl) {
                        score += 100;
                        document.getElementById('points-tag').innerText = score;
                        alert("TROVATO!");
                        currentLvl++;
                        currentSub = 0;
                        loadStep();
                    }
                });
            });
        });
    </script>
</body>
</html>
