<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scienza AR - Caccia al Tesoro</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        :root {
            --primary: #00d2ff;
            --dark: #1a1a2e;
            --accent: #f1c40f;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: sans-serif; 
            background: black;
        }

        /* Forza la UI a stare SOPRA tutto */
        .ui-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999; /* Valore altissimo */
            pointer-events: none; /* Permette di toccare la camera se necessario */
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--dark);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: auto; /* Riattiva i click per i menu */
        }

        .box {
            background: rgba(255,255,255,0.1);
            padding: 25px; border-radius: 15px;
            border: 2px solid var(--primary);
            width: 80%; max-width: 300px;
            text-align: center; color: white;
            backdrop-filter: blur(10px);
        }

        input {
            width: 100%; padding: 12px; margin: 10px 0;
            border-radius: 8px; border: none; box-sizing: border-box;
        }

        button {
            width: 100%; padding: 15px;
            background: var(--primary); border: none;
            color: white; font-weight: bold; border-radius: 8px;
            cursor: pointer; text-transform: uppercase;
        }

        #game-ui {
            position: absolute; top: 20px; width: 100%;
            display: none; justify-content: space-around;
        }

        .badge {
            background: rgba(0,0,0,0.8); color: var(--accent);
            padding: 8px 12px; border-radius: 10px; font-size: 12px;
            border: 1px solid var(--accent);
        }

        #ar-instruction {
            position: absolute; bottom: 30px; width: 100%;
            text-align: center; color: white; display: none;
        }

        .hint-text { color: var(--accent); margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="ui-layer">
        
        <div id="login-screen" class="overlay">
            <div class="box">
                <h2 style="color:var(--primary)">MISSIONE SCIENZA</h2>
                <input type="text" id="nome" placeholder="Nome">
                <input type="text" id="cognome" placeholder="Cognome">
                <button onclick="startGame()">Inizia Gioco</button>
            </div>
        </div>

        <div id="quiz-screen" class="overlay" style="display: none;">
            <div class="box">
                <h3 id="level-title" style="color:var(--primary)">Livello 1</h3>
                <p id="question-text">Caricamento...</p>
                <input type="text" id="answer-input" placeholder="Risposta">
                <button onclick="checkAnswer()">Invia</button>
                <div id="hint-box" class="hint-text" style="display:none"></div>
                <button id="btn-ar" onclick="activateAR()" style="display:none; background:#27ae60; margin-top:10px;">Apri Scanner AR</button>
            </div>
        </div>

        <div id="game-ui">
            <div class="badge">UTENTE: <span id="ui-user">---</span></div>
            <div class="badge">PUNTI: <span id="ui-score">0</span></div>
        </div>

        <div id="ar-instruction">
            <div style="background:rgba(0,0,0,0.7); padding:10px; display:inline-block; border-radius:10px;">
                Inquadra il marcatore del livello!
            </div>
        </div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-marker type="pattern" url="pattern-marker2.patt" id="marker-0">
            <a-box position="0 0.5 0" material="color: #00d2ff;"></a-box>
        </a-marker>
        <a-marker type="pattern" url="marker3.patt" id="marker-1">
            <a-box position="0 0.5 0" material="color: #ff4757;"></a-box>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // DATI E LOGICA
        let currentLevel = 0;
        let currentSubQuestion = 0;
        let score = 0;
        let user = "";

        const gameData = [
            { 
                questions: [
                    { q: "Qual è la formula dell'acqua?", a: "h2o" },
                    { q: "A che temperatura bolle?", a: "100" }
                ],
                hint: "Cerca vicino al lavandino"
            },
            { 
                questions: [
                    { q: "Quante eliche ha il DNA?", a: "2" }
                ],
                hint: "Cerca tra i libri di biologia"
            }
        ];

        function startGame() {
            const n = document.getElementById('nome').value;
            const c = document.getElementById('cognome').value;
            if(!n || !c) return alert("Mancano i dati!");
            
            user = n + " " + c;
            document.getElementById('ui-user').innerText = user;
            document.getElementById('login-screen').style.display = 'none';
            loadLevel();
        }

        function loadLevel() {
            if(currentLevel >= gameData.length) {
                alert("FINITO! Punti: " + score);
                location.reload();
                return;
            }

            // Reset UI per il nuovo livello
            document.getElementById('quiz-screen').style.display = 'flex';
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('ar-instruction').style.display = 'none';
            document.getElementById('btn-ar').style.display = 'none';
            document.getElementById('hint-box').style.display = 'none';

            const level = gameData[currentLevel];
            document.getElementById('level-title').innerText = "Oggetto " + (currentLevel + 1);
            document.getElementById('question-text').innerText = level.questions[currentSubQuestion].q;
            document.getElementById('answer-input').value = "";
        }

        function checkAnswer() {
            const reply = document.getElementById('answer-input').value.toLowerCase().trim();
            const level = gameData[currentLevel];

            if(reply === level.questions[currentSubQuestion].a) {
                if(currentSubQuestion < level.questions.length - 1) {
                    currentSubQuestion++;
                    loadLevel();
                } else {
                    document.getElementById('hint-box').innerText = "BRAVO! Indizio: " + level.hint;
                    document.getElementById('hint-box').style.display = 'block';
                    document.getElementById('btn-ar').style.display = 'block';
                }
            } else {
                alert("Sbagliato!");
            }
        }

        function activateAR() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('ar-instruction').style.display = 'block';
        }

        function foundObject() {
            score += 100;
            document.getElementById('ui-score').innerText = score;
            alert("Ottimo! Livello Superato.");
            currentLevel++;
            currentSubQuestion = 0;
            loadLevel();
        }

        // Listener Marcatori
        window.onload = () => {
            const markers = document.querySelectorAll('a-marker');
            markers.forEach(m => {
                m.addEventListener('markerFound', () => {
                    const isScanning = document.getElementById('ar-instruction').style.display === 'block';
                    if(isScanning && m.id === "marker-" + currentLevel) {
                        foundObject();
                    }
                });
            });
        }
    </script>
</body>
</html>
