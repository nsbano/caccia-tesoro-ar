<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scienza AR - Missione</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        :root {
            --primary: #00d2ff;
            --dark: #1a1a2e;
            --accent: #f1c40f;
        }

        /* RESET TOTALE */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: Arial, sans-serif;
            background-color: #000 !important;
        }

        /* UI MASTER - BLOCCATA */
        #ui-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 9999;
            pointer-events: none;
        }

        /* SCHERMATE (LOGIN E QUIZ) */
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        /* IL BOX: Centrato con transform per non subire scossoni dalla tastiera */
        .glass-box {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--primary);
            width: 80%;
            max-width: 320px;
            text-align: center;
            color: white;
        }

        h1 { font-size: 28px; margin-bottom: 10px; color: var(--primary); }
        p { font-size: 18px; line-height: 1.4; }

        input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            border: none;
            font-size: 18px; /* Evita lo zoom automatico su iOS */
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
        }

        /* HUD: I CONTATORI IN ALTO - Molto più grandi */
        #hud {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            display: none; /* Attivato via JS */
            justify-content: space-around;
            pointer-events: none;
        }

        .badge {
            background: rgba(0, 0, 0, 0.85);
            color: var(--accent);
            padding: 15px 20px;
            border-radius: 12px;
            border: 2px solid var(--accent);
            font-size: 20px; /* Testo grande */
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* BARRA ISTRUZIONI IN BASSO */
        #instruction-bar {
            position: absolute;
            bottom: 50px;
            left: 5%;
            width: 90%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            display: none;
            font-size: 22px; /* Testo molto grande */
            font-weight: bold;
            border: 2px solid var(--primary);
            box-sizing: border-box;
        }

        /* FIX PER VIDEO AR.JS */
        video {
            z-index: -1 !important;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="login-screen" class="screen">
            <div class="glass-box">
                <h1>MISSIONE AR</h1>
                <p>Inserisci i tuoi dati</p>
                <input type="text" id="nome" placeholder="Nome" autocomplete="off">
                <input type="text" id="cognome" placeholder="Cognome" autocomplete="off">
                <button onclick="startGame()">GIOCA ORA</button>
            </div>
        </div>

        <div id="quiz-screen" class="screen" style="display: none;">
            <div class="glass-box">
                <h2 id="lvl-title" style="color:var(--primary)">Livello 1</h2>
                <p id="question-txt">...</p>
                <input type="text" id="answer-in" placeholder="Scrivi qui..." autocomplete="off">
                <button onclick="checkAnswer()">VERIFICA</button>
                <p id="hint-txt" style="display:none; color:var(--accent); font-size:16px; margin-top:10px;"></p>
                <button id="btn-ar" onclick="startAR()" style="display:none; background:#2ecc71; margin-top:10px;">VAI ALL'AR</button>
            </div>
        </div>

        <div id="hud">
            <div class="badge" id="user-tag">---</div>
            <div class="badge">PT: <span id="score-tag">0</span></div>
        </div>

        <div id="instruction-bar">Punta la fotocamera!</div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; facingMode: environment;"
             vr-mode-ui="enabled: false"
             renderer="logarithmicDepthBuffer: true; alpha: true;">
        
        <a-marker type="pattern" url="marker2.patt" id="marker-0">
            <a-sphere position="0 0.5 0" radius="0.5" color="#00d2ff" animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true"></a-sphere>
        </a-marker>

        <a-marker type="pattern" url="marker3.patt" id="marker-1">
            <a-box position="0 0.5 0" material="color: #ff4757" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let currentLevel = 0;
        let subQ = 0;
        let points = 0;

        const database = [
            { 
                questions: [{q: "Formula dell'acqua?", a: "h2o"}, {q: "Gradi ebollizione?", a: "100"}],
                hint: "Cerca vicino al lavandino!"
            },
            { 
                questions: [{q: "Eliche DNA?", a: "2"}],
                hint: "Cerca in biblioteca!"
            }
        ];

        function startGame() {
            const n = document.getElementById('nome').value;
            const c = document.getElementById('cognome').value;
            if(!n || !c) return alert("Dati incompleti!");
            
            document.getElementById('user-tag').innerText = n.toUpperCase();
            document.getElementById('login-screen').style.display = 'none';
            loadQuiz();
        }

        function loadQuiz() {
            if(currentLevel >= database.length) {
                alert("MISSIONE FINITA!");
                location.reload();
                return;
            }
            document.getElementById('quiz-screen').style.display = 'flex';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('instruction-bar').style.display = 'none';
            document.getElementById('btn-ar').style.display = 'none';
            document.getElementById('hint-txt').style.display = 'none';

            const lvl = database[currentLevel];
            document.getElementById('lvl-title').innerText = "OGGETTO " + (currentLevel + 1);
            document.getElementById('question-txt').innerText = lvl.questions[subQ].q;
            document.getElementById('answer-in').value = "";
        }

        function checkAnswer() {
            const reply = document.getElementById('answer-in').value.toLowerCase().trim();
            const lvl = database[currentLevel];

            if(reply === lvl.questions[subQ].a) {
                if(subQ < lvl.questions.length - 1) {
                    subQ++;
                    loadQuiz();
                } else {
                    document.getElementById('hint-txt').innerText = "Indizio: " + lvl.hint;
                    document.getElementById('hint-txt').style.display = 'block';
                    document.getElementById('btn-ar').style.display = 'block';
                }
            } else {
                alert("Sbagliato!");
            }
        }

        function startAR() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('instruction-bar').style.display = 'block';
        }

        window.onload = () => {
            const markers = document.querySelectorAll('a-marker');
            markers.forEach(m => {
                m.addEventListener('markerFound', () => {
                    const active = document.getElementById('instruction-bar').style.display === 'block';
                    if(active && m.id === "marker-" + currentLevel) {
                        points += 100;
                        document.getElementById('score-tag').innerText = points;
                        alert("TROVATO!");
                        currentLevel++;
                        subQ = 0;
                        loadQuiz();
                    }
                });
            });
        }
    </script>
</body>
</html>
