<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scienza AR - Missione</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        :root {
            --primary: #00d2ff;
            --dark: #1a1a2e;
            --accent: #f1c40f;
        }

        /* Forza il video a stare sotto e coprire tutto */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: sans-serif;
            background-color: transparent !important;
        }

        video {
            position: fixed !important; top: 0; left: 0;
            width: 100vw !important; height: 100vh !important;
            object-fit: cover !important; z-index: -1 !important;
        }

        /* Contenitore UI principale: fisso per non muoversi con la tastiera */
        #ui-master {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100dvh; /* Altezza dinamica */
            z-index: 999; pointer-events: none;
        }

        /* Schermate Login e Quiz */
        .overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--dark);
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px; border-radius: 25px;
            border: 2px solid var(--primary);
            width: 85%; max-width: 350px;
            text-align: center; color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Input grandi per dita umane */
        input {
            width: 100%; padding: 18px; margin: 15px 0;
            border-radius: 15px; border: none;
            font-size: 18px; text-align: center;
            box-sizing: border-box;
        }

        button {
            width: 100%; padding: 18px;
            background: var(--primary); color: white;
            border: none; border-radius: 15px;
            font-weight: bold; font-size: 18px;
            text-transform: uppercase; cursor: pointer;
        }

        /* HUD: Badge in alto più grandi */
        #game-stats {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: 0; width: 100%;
            display: none; justify-content: space-evenly;
            pointer-events: none;
        }

        .stat-badge {
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            padding: 12px 20px;
            border-radius: 15px;
            font-size: 16px; /* Aumentato */
            font-weight: bold;
            border: 2px solid var(--accent);
            min-width: 120px; text-align: center;
        }

        /* Istruzioni in basso: Grandi e Leggibili */
        #instruction-bar {
            position: absolute;
            bottom: max(40px, env(safe-area-inset-bottom));
            left: 10%; width: 80%;
            background: rgba(0,0,0,0.85);
            color: white; padding: 20px;
            border-radius: 20px; text-align: center;
            display: none; font-size: 18px; /* Aumentato */
            font-weight: bold; border: 2px solid var(--primary);
        }

        #hint-txt { font-size: 16px; color: var(--accent); margin: 15px 0; }
    </style>
</head>
<body>

    <div id="ui-master">
        <div id="screen-login" class="overlay">
            <div class="glass-box">
                <h1 style="color:var(--primary); font-size: 28px; margin: 0 0 10px 0;">MISSIONE AR</h1>
                <p style="opacity:0.8; font-size: 16px;">Inserisci nome e cognome</p>
                <input type="text" id="nome" placeholder="Nome">
                <input type="text" id="cognome" placeholder="Cognome">
                <button onclick="startGame()">ENTRA NEL GIOCO</button>
            </div>
        </div>

        <div id="screen-quiz" class="overlay" style="display: none;">
            <div class="glass-box">
                <h2 id="level-label" style="color:var(--primary); font-size: 24px; margin:0;">Livello 1</h2>
                <p id="question-txt" style="margin: 25px 0; font-size: 18px; line-height: 1.4;">...</p>
                <input type="text" id="answer-in" placeholder="Risposta...">
                <button onclick="checkAnswer()">CONTROLLA</button>
                <div id="hint-txt" style="display:none;"></div>
                <button id="btn-scan" onclick="goAR()" style="display:none; background:#27ae60; margin-top: 15px;">🔍 SCANSIONA ORA</button>
            </div>
        </div>

        <div id="game-stats">
            <div class="stat-badge"><span id="user-display">---</span></div>
            <div class="stat-badge">PUNTI: <span id="score-display">0</span></div>
        </div>

        <div id="instruction-bar">Punta la camera verso l'oggetto!</div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; facingMode: environment;"
             renderer="antialias: true; alpha: true;"
             vr-mode-ui="enabled: false">
        
        <a-marker type="pattern" url="marker2.patt" id="marker-0">
            <a-sphere position="0 0.5 0" radius="0.6" color="#00d2ff" material="opacity: 0.8; transparent: true"></a-sphere>
        </a-marker>

        <a-marker type="pattern" url="marker3.patt" id="marker-1">
            <a-box position="0 0.5 0" scale="0.8 0.8 0.8" color="#ff4757"></a-box>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let currentLevel = 0;
        let currentSub = 0;
        let score = 0;

        const data = [
            { 
                questions: [
                    { q: "Qual è la formula chimica dell'acqua?", a: "h2o" },
                    { q: "A quanti gradi bolle l'acqua?", a: "100" }
                ],
                hint: "Indizio: Cerca dove c'è un rubinetto!"
            },
            { 
                questions: [
                    { q: "Cosa significa DNA?", a: "acido desossiribonucleico" }
                ],
                hint: "Indizio: Cerca tra i libri!"
            }
        ];

        function startGame() {
            const n = document.getElementById('nome').value.trim();
            const c = document.getElementById('cognome').value.trim();
            if(!n || !c) return alert("Inserisci i dati!");
            
            document.getElementById('user-display').innerText = n.toUpperCase();
            document.getElementById('screen-login').style.display = 'none';
            showQuiz();
        }

        function showQuiz() {
            if(currentLevel >= data.length) {
                alert("COMPLIMENTI! HAI FINITO!");
                location.reload();
                return;
            }

            document.getElementById('screen-quiz').style.display = 'flex';
            document.getElementById('game-stats').style.display = 'none';
            document.getElementById('instruction-bar').style.display = 'none';
            document.getElementById('btn-scan').style.display = 'none';
            document.getElementById('hint-txt').style.display = 'none';

            const levelData = data[currentLevel];
            document.getElementById('level-label').innerText = "OGGETTO #" + (currentLevel + 1);
            document.getElementById('question-txt').innerText = levelData.questions[currentSub].q;
            document.getElementById('answer-in').value = "";
        }

        function checkAnswer() {
            const ans = document.getElementById('answer-in').value.toLowerCase().trim();
            const levelData = data[currentLevel];

            if(ans === levelData.questions[currentSub].a) {
                if(currentSub < levelData.questions.length - 1) {
                    currentSub++;
                    showQuiz();
                } else {
                    document.getElementById('hint-txt').innerText = levelData.hint;
                    document.getElementById('hint-txt').style.display = 'block';
                    document.getElementById('btn-scan').style.display = 'block';
                }
            } else {
                alert("Ops! Risposta sbagliata.");
            }
        }

        function goAR() {
            document.getElementById('screen-quiz').style.display = 'none';
            document.getElementById('game-stats').style.display = 'flex';
            document.getElementById('instruction-bar').style.display = 'block';
        }

        window.onload = () => {
            const markers = document.querySelectorAll('a-marker');
            markers.forEach(m => {
                m.addEventListener('markerFound', () => {
                    const scanning = document.getElementById('instruction-bar').style.display === 'block';
                    if(scanning && m.id === "marker-" + currentLevel) {
                        score += 100;
                        document.getElementById('score-display').innerText = score;
                        alert("Bravissimo! Oggetto trovato.");
                        currentLevel++;
                        currentSub = 0;
                        showQuiz();
                    }
                });
            });
        }
    </script>
</body>
</html>
