<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scienza AR - Caccia al Tesoro</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #00458b;
            --accent: #f1c40f;
            --dark: #1a1a2e;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--dark);
            position: fixed; /* Previene scroll elastico su iOS */
        }
        
        /* Video della camera sempre sotto */
        video { position: fixed !important; top: 0 !important; left: 0 !important; z-index: -1 !important; }

        /* Schermate a tutto schermo (Login e Quiz) */
        .overlay {
            position: fixed; top: 0; left: 0; 
            width: 100%; height: 100dvh; /* Ignora salti da tastiera */
            background: var(--dark); color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 2000; text-align: center;
        }

        /* Box Login e Quiz centrati e compatti */
        .login-box, .quiz-container { 
            background: rgba(255,255,255,0.05); 
            padding: 30px; 
            border-radius: 20px; 
            border: 2px solid var(--primary); 
            width: 85%; 
            max-width: 320px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        
      /* UI di Gioco sopra la camera (Badge Punti/Utente) */
        #game-ui {
            position: fixed; 
            /* env() evita che la tacca del telefono copra i contatori */
            top: max(25px, env(safe-area-inset-top)); 
            left: 5%;  /* Stacca i margini dai bordi laterali */
            width: 90%; 
            z-index: 9999; /* Assicura che sia sempre in primissimo piano */
            display: none;
            justify-content: space-between; /* Spinge i badge ai due lati opposti */
            pointer-events: none;
            box-sizing: border-box;
        }

        .badge { 
            background: rgba(0,0,0,0.85); 
            color: var(--accent); 
            padding: 8px 15px; 
            border-radius: 12px; 
            border: 1px solid var(--accent); 
            font-weight: bold; 
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); /* Aggiunge stacco visivo */
        }

        /* Input migliorati per schermi touch */
        input { 
            width: 100%; 
            height: 50px;
            box-sizing: border-box; 
            padding: 0 15px; margin: 10px 0; 
            border-radius: 8px; border: 1px solid #444; 
            background: #252545; color: white;
            font-size: 16px; /* Evita zoom automatico su iPhone */
            text-align: center; 
        }
        
        button { 
            width: 100%; height: 55px;
            background: var(--primary); color: white; border: none; 
            border-radius: 8px; font-weight: bold; 
            cursor: pointer; font-size: 16px; text-transform: uppercase; 
            margin-top: 10px; letter-spacing: 1px;
        }
        
        button:active { transform: scale(0.95); }

        .hint-text { color: var(--accent); margin-top: 15px; font-style: italic; display: none; font-size: 14px; }
        
       /* Istruzioni in basso nella schermata AR */
        #ar-instruction { 
            position: fixed; 
            /* Evita la barra di scorrimento inferiore di iPhone/Android */
            bottom: max(35px, env(safe-area-inset-bottom)); 
            left: 5%; 
            width: 90%; 
            text-align: center; 
            color: white; 
            z-index: 9999; 
            display: none; 
            font-weight: bold;
            font-size: 16px;
            /* Uno sfondo semi-trasparente per renderlo sempre leggibile sulla camera */
            background: rgba(0,0,0,0.6); 
            padding: 12px;
            border-radius: 12px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay">
        <div class="login-box">
            <h1 style="color:var(--primary); margin:0 0 10px 0; font-size:22px;">MISSIONE SCIENZA</h1>
            <p style="color:#aaa; font-size:14px; margin-bottom:25px;">Inserisci i tuoi dati</p>
            <input type="text" id="nome" placeholder="Nome" autocomplete="off" spellcheck="false">
            <input type="text" id="cognome" placeholder="Cognome" autocomplete="off" spellcheck="false">
            <button onclick="startGame()">Inizia Gioco</button>
        </div>
    </div>

    <div id="quiz-screen" class="overlay" style="display: none;">
        <div class="quiz-container">
            <h2 id="level-title" style="color:var(--primary); margin-top:0;">Livello 1</h2>
            <p id="question-text">Domanda...</p>
            <input type="text" id="answer-input" placeholder="Tua risposta" autocomplete="off" spellcheck="false">
            <button onclick="checkAnswer()">Verifica</button>
            <div id="hint-box" class="hint-text"></div>
            <button id="btn-ar" onclick="activateAR()" style="display: none; background: #27ae60; margin-top: 15px;">Attiva Scanner AR</button>
        </div>
    </div>

    <div id="game-ui">
        <div class="badge">UTENTE: <span id="ui-user">---</span></div>
        <div class="badge">PUNTI: <span id="ui-score">0</span></div>
    </div>
    <div id="ar-instruction">Inquadra il marcatore per trovare l'oggetto!</div>

<a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false;" 
             renderer="alpha: true; antialias: true; preserveDrawingBuffer: true;"
             vr-mode-ui="enabled: false"
             cursor="rayOrigin: mouse" 
             raycaster="objects: .clickable">
        
        <a-marker type="pattern" url="marker1.patt" id="marker-0">
            <a-entity class="clickable" premio-cliccabile position="0 0.5 0" scale="0.5 0.5 0.5" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
                <a-box class="visual-box" material="color: #00d2ff; opacity: 0.9;"></a-box>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker2.patt" id="marker-1">
            <a-entity class="clickable" premio-cliccabile position="0 0.5 0" scale="0.5 0.5 0.5" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
                <a-box class="visual-box" material="color: #ff4757; opacity: 0.9;"></a-box>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker3.patt" id="marker-2">
            <a-entity class="clickable" premio-cliccabile position="0 0.5 0" scale="0.5 0.5 0.5" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
                <a-box class="visual-box" material="color: #2ed573; opacity: 0.9;"></a-box>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker4.patt" id="marker-3">
            <a-entity class="clickable" premio-cliccabile position="0 0.5 0" scale="0.5 0.5 0.5" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
                <a-box class="visual-box" material="color: #eccc68; opacity: 0.9;"></a-box>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker5.patt" id="marker-4">
            <a-entity class="clickable" premio-cliccabile position="0 0.5 0" scale="0.5 0.5 0.5" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
                <a-box class="visual-box" material="color: #ffa502; opacity: 0.9;"></a-box>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker6.patt" id="marker-5">
            <a-entity class="clickable" premio-cliccabile position="0 0.5 0" scale="0.5 0.5 0.5" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
                <a-box class="visual-box" material="color: #ff6b81; opacity: 0.9;"></a-box>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker7.patt" id="marker-6">
            <a-entity class="clickable" premio-cliccabile position="0 0.5 0" scale="0.5 0.5 0.5" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
                <a-box class="visual-box" material="color: #747d8c; opacity: 0.9;"></a-box>
            </a-entity>
        </a-marker>

        <a-marker type="pattern" url="marker8.patt" id="marker-7">
            <a-entity class="clickable" premio-cliccabile position="0 0.5 0" scale="0.5 0.5 0.5" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
                <a-box class="visual-box" material="color: #5352ed; opacity: 0.9;"></a-box>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // DATI DEL GIOCO: 8 LIVELLI CON SOTTO-DOMANDE
        const gameData = [
            { 
                questions: [
                    { q: "Qual è la formula chimica dell'acqua?", a: "h2o" },
                    { q: "A che temperatura bolle l'acqua (gradi Celsius)?", a: "100" },
                    { q: "L'acqua è un solvente universale? (si/no)", a: "si" }
                ],
                hint: "Cerca dove l'acqua scorre (vicino a un lavandino)", color: "#00d2ff" 
            },
            { 
                questions: [
                    { q: "Cosa significa l'acronimo DNA?", a: "acido desossiribonucleico" },
                    { q: "Quante eliche ha il DNA?", a: "2" }
                ],
                hint: "Cerca tra i libri di biologia", color: "#ff4757" 
            },
            { 
                questions: [
                    { q: "Qual è la particella con carica negativa dell'atomo?", a: "elettrone" }
                ],
                hint: "Cerca vicino a una fonte di elettricità", color: "#2ed573" 
            },
            { 
                questions: [
                    { q: "Chi osservò per primo le cellule al microscopio?", a: "hooke" }
                ],
                hint: "Cerca dove c'è molta luce", color: "#eccc68" 
            },
            { 
                questions: [
                    { q: "Passaggio da liquido a gassoso?", a: "evaporazione" }
                ],
                hint: "Cerca in cucina vicino ai fornelli", color: "#ffa502" 
            },
            { 
                questions: [
                    { q: "Il pianeta più grande del sistema solare?", a: "giove" }
                ],
                hint: "Cerca verso l'alto (finestra)", color: "#ff6b81" 
            },
            { 
                questions: [
                    { q: "Unità di misura della tensione elettrica?", a: "volt" }
                ],
                hint: "Cerca vicino a una presa di corrente", color: "#747d8c" 
            },
            { 
                questions: [
                    { q: "La forza che attira tutto verso il centro della Terra?", a: "gravità" }
                ],
                hint: "Cerca l'oggetto caduto sul pavimento", color: "#5352ed" 
            }
        ];

        let currentLevel = 0;      
        let currentSubQuestion = 0; 
        let score = 0;
        let user = "";

  // Componente A-Frame per il tocco dell'oggetto 3D
        AFRAME.registerComponent('premio-cliccabile', {
            init: function () {
                this.el.addEventListener('click', (evento) => {
                    if(document.getElementById('ar-instruction').style.display === 'block') {
                        
                        // Controlliamo in quale marcatore si trova l'oggetto cliccato
                        const markerCliccato = this.el.parentNode.id;
                        const markerCorretto = "marker-" + currentLevel;

                        // Se l'utente inquadra il marcatore del livello giusto...
                        if (markerCliccato === markerCorretto) {
                            foundObject();
                        } else {
                            // Se inquadra un marcatore di un altro livello
                            alert("Hai trovato un oggetto, ma non è quello giusto per questo livello! Segui l'indizio.");
                        }
                    }
                });
            }
        });

        function startGame() {
            const nome = document.getElementById('nome').value.trim();
            const cognome = document.getElementById('cognome').value.trim();
            if(!nome || !cognome) return alert("Inserisci nome e cognome!");
            
            user = nome + " " + cognome;
            document.getElementById('ui-user').innerText = user;
            document.getElementById('login-screen').style.display = 'none';
            loadLevel();
        }

        function loadLevel() {
            if(currentLevel >= gameData.length) {
                alert("CONGRATULAZIONI " + user + "! Hai completato la caccia con " + score + " punti!");
                location.reload();
                return;
            }
            
            document.getElementById('quiz-screen').style.display = 'flex';
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('ar-instruction').style.display = 'none';
            
            const levelData = gameData[currentLevel];
            const totalSub = levelData.questions.length;
            
            document.getElementById('level-title').innerText = `Oggetto ${currentLevel + 1} - Domanda ${currentSubQuestion + 1}/${totalSub}`;
            document.getElementById('question-text').innerText = levelData.questions[currentSubQuestion].q;
            
            document.getElementById('answer-input').value = "";
            document.getElementById('hint-box').style.display = 'none';
            document.getElementById('btn-ar').style.display = 'none';
        }

        function checkAnswer() {
            const ans = document.getElementById('answer-input').value.toLowerCase().trim();
            const levelData = gameData[currentLevel];
            const correctAnswer = levelData.questions[currentSubQuestion].a;

            if(ans === correctAnswer) {
                if (currentSubQuestion < levelData.questions.length - 1) {
                    currentSubQuestion++; 
                    alert("Esatto! Prossima domanda...");
                    loadLevel();
                } else {
                    document.getElementById('hint-box').innerText = "OTTIMO! Hai sbloccato l'indizio: " + levelData.hint;
                    document.getElementById('hint-box').style.display = 'block';
                    document.getElementById('btn-ar').style.display = 'block';
                    currentSubQuestion = 0; 
                }
            } else {
                alert("Risposta errata! Riprova.");
            }
        }

        function activateAR() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('ar-instruction').style.display = 'block';
            document.body.style.background = "transparent";

            // Cambia colore al cubo in base al livello attuale
           
            
            window.dispatchEvent(new Event('resize'));
        }

        function foundObject() {
            score += 100;
            document.getElementById('ui-score').innerText = score;
            alert("Ottimo! Hai trovato l'oggetto dell'Oggetto " + (currentLevel + 1));
            currentLevel++;
            loadLevel();
        }
    </script>
</body>
</html>
