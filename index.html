<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scienza AR - Fix Definitivo</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-look-around.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: transparent !important; }
        
        /* Forza il video a stare sotto tutto */
        #arjs-video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            z-index: -2 !important;
        }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a192f; color: white; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
        }

        #game-ui {
            position: fixed; top: 10px; width: 100%; display: none;
            justify-content: space-around; z-index: 1000; pointer-events: none;
        }

        .stat-box { background: rgba(0,0,0,0.8); color: #64ffda; padding: 10px; border-radius: 8px; border: 1px solid #64ffda; }
        button { padding: 15px 30px; font-size: 1.2rem; background: #64ffda; color: #0a192f; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>

<body>

    <div id="start-screen">
        <h1>REALTÀ ATTIVA</h1>
        <button onclick="startGame()">AVVIA CAMERA</button>
    </div>

    <div id="game-ui">
        <div class="stat-box">PUNTI: <span id="score">0</span></div>
        <div class="stat-box">TEMPO: <span id="timer">60:00</span></div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        
        <a-box position="0 0.5 -5" material="color: red;" 
               animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-box>

        <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            document.body.style.backgroundColor = "transparent";

            // Tentativo di forzare l'avvio del video se rimasto nero
            const video = document.querySelector('video');
            if (video) {
                video.id = "arjs-video"; // Assegna l'ID per il CSS
                video.play().catch(e => console.log("Errore autoplay:", e));
            }

            // Forza il ricalcolo delle dimensioni
            window.dispatchEvent(new Event('resize'));
        }
    </script>
</body>
</html>
