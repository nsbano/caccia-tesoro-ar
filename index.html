<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scienza AR - Missione QR</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        :root { --primary: #00d2ff; --dark: #1a1a2e; --accent: #f1c40f; }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: sans-serif;
            background-color: transparent !important;
        }

        /* UI LAYER */
        #ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; pointer-events: none;
        }

        /* SCHERMATE MENU */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); display: flex; align-items: center; justify-content: center;
            pointer-events: auto;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); padding: 30px; border-radius: 25px;
            border: 2px solid var(--primary); width: 85%; max-width: 320px;
            text-align: center; color: white;
        }

        /* HUD - CORREZIONE POSIZIONAMENTO */
        #hud-top {
            position: absolute; top: 40px; left: 0; width: 100%;
            display: none; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box;
        }

        .badge {
            background: rgba(0, 0, 0, 0.8); color: var(--accent);
            padding: 10px 15px; border-radius: 12px; border: 2px solid var(--accent);
            font-size: 18px; font-weight: bold; pointer-events: auto;
        }

        /* BARRA IN BASSO - FIX CENTRATURA */
       #bottom-bar {
    position: fixed; /* Fixed è più stabile di absolute per la UI */
    bottom: 30px; 
    left: 50%; 
    transform: translateX(-50%); 
    width: 85%; 
    max-width: 400px; /* Evita che diventi troppo larga su tablet */
    background: rgba(0, 0, 0, 0.85); 
    color: white;
    padding: 20px; 
    border-radius: 20px;
    text-align: center; 
    display: none;
    font-size: 18px; 
    font-weight: bold;
    border: 2px solid var(--primary);
    box-sizing: border-box; /* Fondamentale: include il padding nel calcolo della larghezza */
    z-index: 10000;
}

        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--primary); border: none; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px; }

        video { z-index: -1 !important; position: fixed !important; top:0; left:0; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="scr-login" class="overlay">
            <div class="glass-box">
                <h2 style="color:var(--primary)">MISSIONE AR</h2>
                <input type="text" id="nome" placeholder="Nome">
                <input type="text" id="cognome" placeholder="Cognome">
                <button onclick="start()">GIOCA</button>
            </div>
        </div>

        <div id="scr-quiz" class="overlay" style="display:none;">
            <div class="glass-box">
                <h3 id="lvl-title" style="color:var(--primary)">OGGETTO 1</h3>
                <p id="question">...</p>
                <input type="text" id="ans" placeholder="Risposta...">
                <button onclick="check()">VERIFICA</button>
                <p id="hint" style="display:none; color:var(--accent); font-weight:bold; margin-top:15px;"></p>
                <button id="btn-ar" onclick="openAR()" style="display:none; background:#2ecc71;">SCANSIONA QR</button>
            </div>
        </div>

        <div id="hud-top">
            <div class="badge" id="name-display">---</div>
            <div class="badge">PT: <span id="pts-display">0</span></div>
        </div>
        <div id="bottom-bar">Inquadra il codice dell'oggetto!</div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
             vr-mode-ui="enabled: false">
        
        <a-marker type="barcode" value="0.png" id="mark-0">
            <a-image src="marker2.jpeg" rotation="-90 0 0" width="2" height="2"></a-image>
            <a-box position="0 0.5 0" material="color: #00d2ff; opacity: 0.8" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        </a-marker>

        <a-marker type="barcode" value="2" id="mark-1">
            <a-sphere position="0 0.5 0" radius="0.6" color="#ff4757"></a-sphere>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let lvl = 0; let sub = 0; let score = 0;
        const db = [
            { qs: [{q: "Formula acqua?", a: "h2o"}, {q: "Bolle a?", a: "100"}], h: "Inquadra il QR sul lavandino" },
            { qs: [{q: "Eliche DNA?", a: "2"}], h: "Inquadra il QR in biblioteca" }
        ];

        function start() {
            const n = document.getElementById('nome').value;
            if(!n) return alert("Inserisci nome!");
            document.getElementById('name-display').innerText = n.toUpperCase();
            document.getElementById('scr-login').style.display = 'none';
            loadQuiz();
        }

        function loadQuiz() {
            if(lvl >= db.length) { alert("FINE MISSIONE!"); location.reload(); return; }
            document.getElementById('scr-quiz').style.display = 'flex';
            document.getElementById('hud-top').style.display = 'none';
            document.getElementById('bottom-bar').style.display = 'none';
            document.getElementById('btn-ar').style.display = 'none';
            document.getElementById('hint').style.display = 'none';

            document.getElementById('lvl-title').innerText = "OGGETTO " + (lvl+1);
            document.getElementById('question').innerText = db[lvl].qs[sub].q;
            document.getElementById('ans').value = "";
        }

        function check() {
            const r = document.getElementById('ans').value.toLowerCase().trim();
            if(r === db[lvl].qs[sub].a) {
                if(sub < db[lvl].qs.length - 1) { sub++; loadQuiz(); }
                else {
                    document.getElementById('hint').innerText = db[lvl].h;
                    document.getElementById('hint').style.display = 'block';
                    document.getElementById('btn-ar').style.display = 'block';
                }
            } else { alert("Riprova!"); }
        }

        function openAR() {
            document.getElementById('scr-quiz').style.display = 'none';
            document.getElementById('hud-top').style.display = 'flex';
            document.getElementById('bottom-bar').style.display = 'block';
        }

        // Fix per il video su mobile
        window.addEventListener('camera-init', () => {
            document.body.style.backgroundColor = "transparent";
        });

        // RICONOSCIMENTO MARKER
        window.onload = () => {
            document.querySelectorAll('a-marker').forEach(m => {
                m.addEventListener('markerFound', () => {
                    const scanning = document.getElementById('bottom-bar').style.display === 'block';
                    if(scanning && m.id === "mark-" + lvl) {
                        score += 100;
                        document.getElementById('pts-display').innerText = score;
                        alert("OGGETTO RICONOSCIUTO! +100");
                        lvl++; sub = 0;
                        loadQuiz();
                    }
                });
            });
        }
    </script>
</body>
</html>
