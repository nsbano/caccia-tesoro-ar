<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Scienza - Fix Definitivo</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-look-around.js"></script>

    <style>
        /* Forza la trasparenza assoluta su ogni possibile livello */
        html, body, a-scene, canvas {
            background-color: transparent !important;
            background: none !important;
            margin: 0; padding: 0; overflow: hidden;
        }

        /* Gestione manuale del video per "bucare" lo schermo nero */
        #custom-video {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: -5; /* Molto lontano dietro gli oggetti */
        }

        #ui {
            position: fixed; top: 10px; width: 100%; z-index: 100;
            display: none; justify-content: space-around; pointer-events: none;
        }
        .stat { background: rgba(0,0,0,0.8); color: #00ff00; padding: 8px; border-radius: 5px; font-family: monospace; }
        
        #btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 20px; z-index: 1000;
            background: #00ff00; color: black; border: none; font-weight: bold;
        }
    </style>
</head>

<body>

    <button id="btn" onclick="startAR()">AVVIA CAMERA</button>

    <div id="ui">
        <div class="stat">SCORE: <span id="s">0</span></div>
        <div class="stat">TIME: <span id="t">60:00</span></div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false;" 
             renderer="alpha: true; antialias: true; colorManagement: true;"
             vr-mode-ui="enabled: false">
        
        <a-box position="0 0.5 -3" material="color: red; opacity: 0.7;" 
               animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-box>

        <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
        async function startAR() {
            document.getElementById('btn').style.display = 'none';
            document.getElementById('ui').style.display = 'flex';

            // TRUCCO MANUALE: Chiediamo la camera direttamente via JS
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                
                // Creiamo noi l'elemento video se AR.js non lo mostra
                let video = document.createElement('video');
                video.setAttribute('id', 'custom-video');
                video.setAttribute('autoplay', '');
                video.setAttribute('playsinline', '');
                video.srcObject = stream;
                document.body.appendChild(video);
                
                console.log("Video iniettato manualmente");
            } catch (err) {
                alert("Errore camera: " + err);
            }

            // Timer
            let sec = 3600;
            setInterval(() => {
                sec--;
                let m = Math.floor(sec/60), s = sec%60;
                document.getElementById('t').innerText = `${m}:${s<10?'0':''}${s}`;
            }, 1000);

            // Forza il refresh grafico
            window.dispatchEvent(new Event('resize'));
        }
    </script>
</body>
</html>
