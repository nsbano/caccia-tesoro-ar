<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scienza AR - Versione Stabile</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        :root { --primary: #00d2ff; --dark: #1a1a2e; --success: #2ecc71; }

        /* RESET TOTALE */
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: sans-serif;
            background-color: #000; /* Nero finché non parte la camera */
        }

        /* UI GENERALE */
        .interface {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
        }

        /* SCHERMATE (LOGIN, QUIZ, SUCCESSO) */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); display: flex;
            align-items: center; justify-content: center;
            pointer-events: auto; z-index: 20;
        }

        .box {
            background: rgba(255,255,255,0.1); border: 2px solid var(--primary);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 20px; border-radius: 15px; width: 85%; max-width: 300px;
            text-align: center; color: white;
        }

        /* HUD - PUNTI E NOME (IN ALTO) */
        #hud-top {
            position: absolute; top: 20px; left: 0; width: 100%;
            display: none; justify-content: space-between; padding: 0 15px;
            z-index: 30;
        }

        /* ISTRUZIONI (IN BASSO) */
        #bottom-bar {
            position: absolute; bottom: 30px; left: 5%; width: 90%;
            background: rgba(0,0,0,0.8); border: 2px solid var(--primary);
            color: white; padding: 12px; border-radius: 10px;
            text-align: center; display: none; z-index: 30; font-weight: bold;
        }

        .badge { background: #000; color: var(--primary); padding: 5px 10px; border-radius: 5px; border: 1px solid var(--primary); }

        /* INPUT E BOTTONI */
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; color: white; font-weight: bold; border-radius: 5px; }

        /* FIX CAMERA */
        video { position: fixed !important; top: 0 !important; left: 0 !important; z-index: -1 !important; }
        .a-canvas { z-index: 1 !important; }
    </style>
</head>
<body>

    <div class="interface">
        
        <div id="scr-login" class="overlay">
            <div class="box">
                <h2>MISSIONE AR</h2>
                <input type="text" id="nome" placeholder="Nome">
                <button onclick="start()">ENTRA</button>
            </div>
        </div>

        <div id="scr-quiz" class="overlay" style="display:none;">
            <div class="box">
                <h3 id="lvl-title">OGGETTO 1</h3>
                <p id="question">...</p>
                <input type="text" id="ans" placeholder="Risposta...">
                <button onclick="check()">VERIFICA</button>
                <div id="hint-box" style="display:none; margin-top:10px;">
                    <p id="hint" style="color:var(--primary); font-size: 0.9em;"></p>
                    <button onclick="openAR()" style="background:var(--success)">APRI CAMERA</button>
                </div>
            </div>
        </div>

        <div id="scr-success" class="overlay" style="display:none; background:rgba(0,0,0,0.6)">
            <div class="box" style="border-color:var(--success)">
                <h2 style="color:var(--success)">BRAVO!</h2>
                <p>Hai trovato l'oggetto.</p>
                <button onclick="nextLevel()" style="background:var(--success)">PROSSIMO LIVELLO</button>
            </div>
        </div>

        <div id="hud-top">
            <div class="badge" id="name-display">---</div>
            <div class="badge">PUNTI: <span id="pts-display">0</span></div>
        </div>
        <div id="bottom-bar">Inquadra il codice dell'oggetto!</div>

    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" vr-mode-ui="enabled: false">
        
        <a-marker type="barcode" value="1" id="mark-0">
            <a-image src="marker2.jpeg" rotation="-90 0 0" width="2" height="2"></a-image>
        </a-marker>

        <a-marker type="barcode" value="2" id="mark-1">
            <a-image src="marker3.jpeg" rotation="-90 0 0" width="2" height="2"></a-image>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let lvl = 0; let score = 0;
        const db = [
            { q: "Formula acqua?", a: "h2o", h: "Cerca il codice n.1" },
            { q: "Eliche DNA?", a: "2", h: "Cerca il codice n.2" }
        ];

        function start() {
            const n = document.getElementById('nome').value;
            if(!n) return alert("Scrivi il nome!");
            document.getElementById('name-display').innerText = n.toUpperCase();
            document.getElementById('scr-login').style.display = 'none';
            // Forza la trasparenza per vedere la camera
            document.body.style.backgroundColor = "transparent";
            loadQuiz();
        }

        function loadQuiz() {
            if(lvl >= db.length) { alert("FINE!"); location.reload(); return; }
            
            document.getElementById('scr-quiz').style.display = 'flex';
            document.getElementById('scr-success').style.display = 'none';
            document.getElementById('hud-top').style.display = 'none';
            document.getElementById('bottom-bar').style.display = 'none';
            document.getElementById('hint-box').style.display = 'none';

            document.getElementById('lvl-title').innerText = "LIVELLO " + (lvl+1);
            document.getElementById('question').innerText = db[lvl].q;
            document.getElementById('ans').value = "";
        }

        function check() {
            const r = document.getElementById('ans').value.toLowerCase().trim();
            if(r === db[lvl].a) {
                document.getElementById('hint').innerText = "INDIZIO: " + db[lvl].h;
                document.getElementById('hint-box').style.display = 'block';
            } else { 
                alert("Sbagliato!"); 
            }
        }

        function openAR() {
            document.getElementById('scr-quiz').style.display = 'none';
            document.getElementById('hud-top').style.display = 'flex';
            document.getElementById('bottom-bar').style.display = 'block';
        }

        function nextLevel() {
            lvl++;
            loadQuiz();
        }

        // RICONOSCIMENTO
        window.onload = () => {
            const markers = document.querySelectorAll('a-marker');
            markers.forEach(m => {
                m.addEventListener('markerFound', () => {
                    const scanning = document.getElementById('bottom-bar').style.display === 'block';
                    if(scanning && m.id === "mark-" + lvl) {
                        score += 100;
                        document.getElementById('pts-display').innerText = score;
                        document.getElementById('bottom-bar').style.display = 'none';
                        document.getElementById('scr-success').style.display = 'flex';
                    }
                });
            });
        }
    </script>
</body>
</html>
