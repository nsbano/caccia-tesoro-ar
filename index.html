<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scienza AR - Sincronizzazione Totale</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-look-around.js"></script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: none; }
        
        /* Il video deve avere z-index -10 per stare sotto il cubo */
        #custom-video {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: -10; 
        }

        #ui {
            position: fixed; top: 10px; width: 100%; z-index: 100;
            display: none; justify-content: space-around; pointer-events: none;
        }
        .stat { background: rgba(0,0,0,0.8); color: #64ffda; padding: 10px; border-radius: 8px; border: 1px solid #64ffda; font-family: sans-serif; }
        
        #btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 20px; z-index: 1000;
            background: #64ffda; color: #0a192f; border: none; font-weight: bold; border-radius: 10px;
        }
    </style>
</head>

<body>

    <button id="btn" onclick="startAR()">AVVIA MISSIONE</button>

    <div id="ui">
        <div class="stat">PUNTI: <span id="s">0</span></div>
        <div class="stat">TEMPO: <span id="t">60:00</span></div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false;" 
             renderer="alpha: true; antialias: true;"
             vr-mode-ui="enabled: false">
        
        <a-box id="test-cube" position="0 1.5 -3" material="color: red; opacity: 0.9;" 
               animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-box>

        <a-camera rotation-reader></a-camera>
    </a-scene>

    <script>
        async function startAR() {
            document.getElementById('btn').style.display = 'none';
            document.getElementById('ui').style.display = 'flex';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                
                // Creiamo il video manuale
                let video = document.createElement('video');
                video.setAttribute('id', 'custom-video');
                video.setAttribute('autoplay', '');
                video.setAttribute('playsinline', '');
                video.srcObject = stream;
                document.body.appendChild(video);
                
                // IMPORTANTE: Diciamo ad A-Frame di aggiornarsi
                const scene = document.querySelector('a-scene');
                scene.renderer.setClearColor(0x000000, 0); // Forza trasparenza renderer
                
            } catch (err) {
                console.error("Errore camera:", err);
            }

            // Timer
            let sec = 3600;
            setInterval(() => {
                sec--;
                let m = Math.floor(sec/60), s = sec%60;
                document.getElementById('t').innerText = `${m}:${s<10?'0':''}${s}`;
            }, 1000);

            // Forza il resize per allineare il cubo alla camera
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 500);
        }
    </script>
</body>
</html>
