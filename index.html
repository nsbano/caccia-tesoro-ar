<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scuola AR - Pro Edition</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        :root { --primary: #00d2ff; --dark: #111; --success: #2ecc71; }

        /* FIX PER CHROME MOBILE */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: sans-serif;
            background-color: #000;
            overscroll-behavior: none; /* Impedisce il refresh a scorrimento di Chrome */
        }

        #ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* BOX DELLE DOMANDE */
        .box {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--primary);
            padding: 25px; border-radius: 15px;
            width: 85%; max-width: 320px;
            text-align: center; color: white;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        /* HUD SUPERIORE */
        #hud {
            position: fixed; top: env(safe-area-inset-top, 10px); left: 0; width: 100%;
            display: none; justify-content: space-between; padding: 10px 15px;
            box-sizing: border-box; z-index: 200; pointer-events: none;
        }

        .badge {
            background: rgba(0,0,0,0.8); color: white; padding: 8px 12px;
            border: 1px solid var(--primary); border-radius: 10px;
            font-weight: bold; font-family: monospace; font-size: 14px;
        }

        /* BOTTONE "CONTINUA" DOPO AR */
        #ar-nav {
            position: fixed; bottom: 40px; left: 0; width: 100%;
            display: none; justify-content: center; z-index: 300;
        }

        .btn-success {
            background: var(--success); color: white; border: none;
            padding: 18px 35px; border-radius: 50px; font-weight: bold;
            font-size: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            pointer-events: auto; cursor: pointer;
        }

        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: none; font-size: 16px; }
        button.main { width: 100%; padding: 15px; background: var(--primary); border: none; color: black; font-weight: bold; border-radius: 8px; font-size: 16px; }

        /* FIX CAMERA CHROME */
        .a-canvas { width: 100% !important; height: 100% !important; top: 0 !important; left: 0 !important; }
        video { position: fixed !important; top: 0 !important; left: 0 !important; z-index: -1 !important; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="badge">⏳ <span id="timer-txt">60:00</span></div>
        <div class="badge">⭐ <span id="score-txt">0</span></div>
    </div>

    <div id="ui-layer">
        <div id="scr-login" class="box">
            <h2>SCIENZA AR</h2>
            <p>Inserisci email studente</p>
            <input type="email" id="email" placeholder="nico@gmail.com">
            <button class="main" onclick="doLogin()">ACCEDI</button>
        </div>

        <div id="scr-quiz" class="box" style="display:none;">
            <h3 id="q-title" style="color:var(--primary); margin:0;">FASE 1</h3>
            <p id="q-text" style="font-size:1.1em; margin:15px 0;">...</p>
            <input type="text" id="ans" placeholder="Risposta...">
            <button class="main" onclick="checkAns()">INVIA</button>
        </div>
    </div>

    <div id="ar-nav">
        <button class="btn-success" onclick="goToNextStage()">CONTINUA MISSIONE ➔</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" vr-mode-ui="enabled: false">
        
        <a-marker type="barcode" value="1" id="mark-0">
            <a-image src="marker2.jpeg" rotation="-90 0 0" width="2" height="2"></a-image>
        </a-marker>

        <a-marker type="barcode" value="2" id="mark-1">
            <a-image src="marker3.jpeg" rotation="-90 0 0" width="2" height="2"></a-image>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const db = {
            "nico@gmail.com": [
                {
                    qs: [
                        { q: "Formula acqua?", a: "h2o" },
                        { q: "Quanti pianeti?", a: "8" },
                        { q: "Gas vitale?", a: "ossigeno" }
                    ],
                    hint: "Indizio: Cerca il Barcode 1 sulla cattedra!"
                },
                {
                    qs: [
                        { q: "Eliche DNA?", a: "2" },
                        { q: "Animale più veloce?", a: "ghepardo" },
                        { q: "Capitale Italia?", a: "roma" }
                    ],
                    hint: "Indizio: Cerca il Barcode 2 vicino alla porta!"
                }
            ]
        };

        let currentMission = [];
        let stage = 0;
        let qIdx = 0;
        let points = 0;
        let timeLeft = 3600;
        let isWaitingForMarker = false;

        function doLogin() {
            const mail = document.getElementById('email').value.toLowerCase().trim();
            if(db[mail]) {
                currentMission = db[mail];
                document.getElementById('scr-login').style.display = 'none';
                document.getElementById('hud').style.display = 'flex';
                startTimer();
                showQuestion();
            } else { alert("Email non abilitata!"); }
        }

        function showQuestion() {
            if(stage >= currentMission.length) {
                finishGame();
                return;
            }

            const currentStageData = currentMission[stage];

            // Se abbiamo finito le 3 domande del blocco
            if(qIdx >= 3) {
                document.getElementById('scr-quiz').innerHTML = `
                    <h2 style="color:var(--success)">DOMANDE OK!</h2>
                    <p style="font-weight:bold">${currentStageData.hint}</p>
                    <button class="main" style="background:white" onclick="closeQuizAndScan()">CERCA OGGETTO</button>
                `;
            } else {
                document.getElementById('q-title').innerText = `FASE ${stage+1} - DOMANDA ${qIdx+1}/3`;
                document.getElementById('q-text').innerText = currentStageData.qs[qIdx].q;
                document.getElementById('ans').value = "";
            }
            document.getElementById('scr-quiz').style.display = 'block';
        }

        function checkAns() {
            const userAns = document.getElementById('ans').value.toLowerCase().trim();
            const correctAns = currentMission[stage].qs[qIdx].a;

            if(userAns === correctAns) {
                qIdx++;
                showQuestion();
            } else {
                alert("Risposta sbagliata! Riprova.");
            }
        }

        function closeQuizAndScan() {
            document.getElementById('scr-quiz').style.display = 'none';
            isWaitingForMarker = true;
        }

        function goToNextStage() {
            // Aggiunge punti e pulisce per il prossimo stage
            points += 50;
            document.getElementById('score-txt').innerText = points;
            document.getElementById('ar-nav').style.display = 'none';
            
            stage++;
            qIdx = 0;
            isWaitingForMarker = false;
            
            // Ricostruisce il contenuto del quiz (pulendo il tasto "Cerca oggetto")
            resetQuizBox();
            showQuestion();
        }

        function resetQuizBox() {
            document.getElementById('scr-quiz').innerHTML = `
                <h3 id="q-title" style="color:var(--primary); margin:0;"></h3>
                <p id="q-text" style="font-size:1.1em; margin:15px 0;"></p>
                <input type="text" id="ans" placeholder="Risposta...">
                <button class="main" onclick="checkAns()">INVIA</button>
            `;
        }

        // --- GESTIONE MARKER ---
        window.onload = () => {
            const markers = document.querySelectorAll('a-marker');
            markers.forEach((m, idx) => {
                m.addEventListener('markerFound', () => {
                    // Se il marker trovato è quello dello stage attuale e siamo in fase di scansione
                    if(isWaitingForMarker && idx === stage) {
                        document.getElementById('ar-nav').style.display = 'flex';
                    }
                });
            });
        }

        function startTimer() {
            setInterval(() => {
                if(timeLeft <= 0) return;
                timeLeft--;
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById('timer-txt').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);
        }

        function finishGame() {
            document.getElementById('scr-quiz').style.display = 'block';
            const bonus = Math.floor(timeLeft / 60);
            document.getElementById('scr-quiz').innerHTML = `
                <h2 style="color:var(--success)">MISSIONE COMPLETA!</h2>
                <p>Punti Barcode: ${points}</p>
                <p>Bonus Tempo: ${bonus}</p>
                <hr>
                <h1>TOTALE: ${points + bonus}</h1>
                <button class="main" onclick="location.reload()">RIGIOCA</button>
            `;
            document.getElementById('hud').style.display = 'none';
        }
    </script>
</body>
</html>
